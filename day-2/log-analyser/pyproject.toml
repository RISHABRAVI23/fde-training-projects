[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-analyser"
version = "0.2.0"
description = "Summarise a web server access log: status codes, top IPs, slowest endpoints, requests per hour."
readme = "README.md"
requires-python = ">=3.11"          # tomllib (config files) is standard library from 3.11
dependencies = []                   # Design A: nothing needed at runtime

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
log-analyser = "log_analyser.cli:main"   # installs a "log-analyser" command that calls main()

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
